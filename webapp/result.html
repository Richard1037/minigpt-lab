<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>判据结果 · MiniGPT</title>
<link rel="stylesheet" href="/manual/assets/manual.css">
<style>
/* 结果窗口：和测评台同一套令牌（manual.css），但它是"盯输出"的页面 ——
   判据结论、拟合图像、原始输出各占一块，跑完不用回主窗口翻控制台。 */
body{display:flex; flex-direction:column; min-height:100vh}
header{padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:5}
header h1{font-size:16px; margin:0}
header .meta{color:var(--dim); font-size:12px}
header .sp{flex:1}
header button,header label{font:12px/1 var(--sans); padding:6px 11px; border-radius:7px;
  background:var(--panel2); border:1px solid var(--line); color:var(--fg); cursor:pointer}
header button:hover{border-color:var(--accent); color:var(--accent)}
main{flex:1; padding:16px 18px 40px; max-width:1180px; margin:0 auto; width:100%}
section{margin-bottom:26px}
h2{font-size:1.25em; margin:0 0 10px; color:#fff; padding-left:10px; border-left:3px solid var(--accent)}
.verdict{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.verdict .big{font-size:22px; font-weight:700}
.verdict.pass{border-left:3px solid var(--ok)} .verdict.pass .big{color:var(--ok)}
.verdict.fail{border-left:3px solid var(--bad)} .verdict.fail .big{color:var(--bad)}
.verdict.pending,.verdict.error{border-left:3px solid var(--warn)}
/* 答案跑通：灰。写在 .pass 之后，同特异度后者胜出 —— 别让它顶着绿色骗人 */
.verdict.answer{border-left-color:#4a5b70} .verdict.answer .big{color:var(--dim)}
.verdict .sub{color:var(--dim); font-size:12.5px}
.fit{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:14px}
.fit h3{margin:0 0 4px; font-size:14px; color:#fff}
.fit .note{font-size:12px; color:var(--dim); margin:0 0 8px}
.fit canvas{width:100%; height:auto; display:block; background:var(--code);
  border-radius:8px; border:1px solid #1c2330}
.legend{display:flex; gap:16px; flex-wrap:wrap; font:11.5px/1 var(--mono); color:var(--dim); margin-top:8px}
.legend i{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px}
.legend .dot{width:9px; height:9px; border-radius:50%; margin-right:6px}
.grp{margin:14px 0 6px; font-size:12px; letter-spacing:.4px; color:var(--accent);
  text-transform:uppercase; border-bottom:1px dashed var(--line); padding-bottom:4px}
.crit{display:flex; gap:10px; align-items:baseline; padding:7px 4px; border-bottom:1px solid #1b222d}
.crit .mk{font:11px/1 var(--mono); padding:3px 7px; border-radius:5px; flex:0 0 auto}
.crit .mk.ok{background:#122a1e; color:var(--ok)} .crit .mk.no{background:#2c1719; color:var(--bad)}
.crit .mk.info{background:#1a212b; color:var(--dim)}
.crit .mk.warn{background:#2b2413; color:var(--warn)}
.crit .nm{font-size:13px; color:#fff; flex:0 0 240px}
.crit .dt{font:12px/1.5 var(--mono); color:#b9c4d4; word-break:break-word}
pre.raw{background:var(--code); border:1px solid var(--line); border-radius:8px; padding:12px;
  font:12px/1.55 var(--mono); white-space:pre-wrap; word-break:break-word; overflow:auto;
  max-height:60vh; color:#cdd6e4}
/* 单项快测的四段：段标签压暗、结论着色，眼睛先落在数值上。
   「判定」这一行在原始文本里是 PASS/FAIL 打头（服务端按行首找结论），
   这里只是把它显示成第四段，文本本身一个字没改。 */
pre.raw .lbl{color:#5c6b80}
pre.raw .ok{color:var(--ok)} pre.raw .bad{color:var(--bad)} pre.raw .warn{color:var(--warn)}

/* 单项快测的四段排成卡片，不再是一坨等宽文本：
   目的 = 正文（sans，公式用衬线斜体）；输入/输出 = 名字 | 值 两列，形状做成 chip；
   判定 = 徽章 + 结论。内容仍是判据打印的那一份，这里只重排版式，不另算任何东西 ——
   用 CSS 而不是 MathJax：CDN 离线时公式会退回成一行 $...$，卡片不能赌网络。 */
.card{background:var(--code); border:1px solid var(--line); border-radius:12px;
  padding:6px 18px 14px}
.card .seg{margin:14px 0 0}
.card .seg > .tag{display:inline-block; font-size:11px; letter-spacing:.6px; color:var(--accent);
  border-bottom:1px dashed var(--line); padding-bottom:2px; margin-bottom:8px}
.card .why{font:14.5px/1.75 var(--sans); color:#dbe6f3; max-width:88ch; margin:0}
.card .io{display:grid; grid-template-columns:minmax(96px,25ch) minmax(0,1fr);
  gap:3px 16px; align-items:baseline}
.card .io .k{font:12.5px/1.6 var(--mono); color:#9fc2ff; word-break:break-word}
.card .io .v{font:12.5px/1.7 var(--mono); color:#cdd6e4; word-break:break-word}
/* 别叫 .note：manual.css 里 .note 是带虚线上边框的小结块，结果窗口也加载它，
   括注会被画成一段一段的虚线。 */
.card .io .v .cmt{color:var(--dim)}
.chip{display:inline-block; padding:1px 7px; border-radius:6px; font-size:12px;
  background:#16202c; border:1px solid #24303f; color:#cfe3ff; margin-right:6px}
.chip.shape{background:#122132; border-color:#1f3a55; color:#8ec7ff; letter-spacing:.3px}
.chip.dtype{background:#1c1a26; border-color:#332f45; color:#c9b8ff}
.chip.count{background:#1a212b; border-color:var(--line); color:var(--dim)}
.card .m{font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;
  font-style:italic; color:#eaf2ff; letter-spacing:.2px}
.card .num,.m .num{color:#e8b473; font-style:normal}
.card .m .num{font-family:inherit}      /* 公式里的数字跟着公式走，别被 manual.css 的 .num 拽成等宽 */
.card .todo{font:11.5px/1 var(--mono); background:#20293a; border:1px solid #2f3d54;
  border-radius:5px; padding:2px 6px; color:#9fc2ff; font-style:normal}
.card .paren{color:var(--dim)}
.card .verdict{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.card .mk{font:11px/1 var(--mono); padding:4px 9px; border-radius:6px; flex:0 0 auto}
.card .mk.ok{background:#122a1e; color:var(--ok)}
.card .mk.no{background:#2c1719; color:var(--bad)}
.card .mk.warn{background:#2b2413; color:var(--warn)}
.card .dt{font:13px/1.7 var(--mono); color:#dbe6f3; word-break:break-word; flex:1}
.card .rest{font:12px/1.55 var(--mono); color:#b9c4d4; white-space:pre-wrap;
  word-break:break-word; border-left:2px solid var(--line); padding-left:10px; margin-top:10px}
/* 结果窗口被拖窄（或讲义里就地跑）时，名字和值改成上下两行，别挤成一团 */
@media (max-width:680px){
  .card .io{grid-template-columns:minmax(0,1fr)}
  .card .io .k{margin-top:7px}
  .card .why{font-size:14px}
}
.empty{color:var(--dim); font-size:13px; background:var(--panel); border:1px dashed var(--line);
  border-radius:10px; padding:16px}
@media print{ header,.legend{display:none} }
</style>
</head>
<body>
<header>
  <h1>判据结果 <span class="meta" id="who">—</span></h1>
  <span class="meta" id="stamp">等待第一次测评…</span>
  <span class="sp"></span>
  <label><input type="checkbox" id="auto" checked> 自动刷新</label>
  <button id="now">立即刷新</button>
  <button id="back">回测评台</button>
</header>
<main>
  <section><div id="verdict" class="verdict"><span class="big">—</span></div></section>
  <section id="sec-fits" hidden><h2>拟合图像</h2><div id="fits"></div></section>
  <section id="sec-cards" hidden><h2>判据逐条</h2><div id="cards"></div></section>
  <section id="sec-curves" hidden><h2>loss 曲线</h2><div id="curves"></div></section>
  <section id="sec-raw" hidden><h2>原始输出</h2>
    <p class="meta" style="margin:-4px 0 8px">
      <span>内容就是命令行看到的那一份，网站只重排版式、没有另算一遍。</span>
      <span>每条快测固定四段：<b>目的</b>（判什么、写错了会是什么症状）·
        <b>输入</b>（喂进去的张量和形状）· <b>输出</b>（它交回来的东西）·
        <b>判定</b>（PASS / FAIL 那一行）。</span></p>
    <div class="card" id="card" hidden></div>
    <pre class="raw" id="raw"></pre></section>
</main>
<script>
const $ = id => document.getElementById(id);
const STAGE = new URLSearchParams(location.search).get('stage') || 's01';
const COL = {pred:'#4aa3ff', truth:'#3ecf8e', data:'#f5b445', axis:'#28313f', text:'#8d99ac'};

/* 画一张拟合图：散点=数据，细线=真实函数，粗线=你的模型输出。
   数据全部来自判据脚本的 JSON 通道（toolkit.Report.fit），这里只做投影和描点 ——
   前端不重新计算任何东西，所以网页上的曲线就是你代码跑出来的那条。 */
function drawFit(box, f){
  const c = document.createElement('canvas');
  const dpr = Math.min(2, devicePixelRatio || 1);
  const W = Math.max(420, box.clientWidth || 900), H = 300;
  c.width = W * dpr; c.height = H * dpr; c.style.width = '100%'; c.style.height = H + 'px';
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const pad = {l:52, r:14, t:12, b:26};
  const all = [].concat(f.x, f.y, f.cx, f.pred || [], f.truth || []);
  let xlo = Math.min(...f.x, ...(f.cx||[])), xhi = Math.max(...f.x, ...(f.cx||[]));
  let ylo = Math.min(...f.y, ...(f.pred||[]), ...(f.truth||[]));
  let yhi = Math.max(...f.y, ...(f.pred||[]), ...(f.truth||[]));
  const yspan = (yhi - ylo) || 1; ylo -= yspan * .08; yhi += yspan * .08;
  const X = x => pad.l + (x - xlo) / ((xhi - xlo) || 1) * (W - pad.l - pad.r);
  const Y = y => H - pad.b - (y - ylo) / (yhi - ylo) * (H - pad.t - pad.b);
  g.fillStyle = '#0b0e13'; g.fillRect(0, 0, W, H);
  g.strokeStyle = COL.axis; g.lineWidth = 1; g.font = '10px ui-monospace,Consolas'; g.fillStyle = COL.text;
  for (let i = 0; i <= 4; i++){                        // 网格 + 刻度
    const xv = xlo + (xhi - xlo) * i / 4, yv = ylo + (yhi - ylo) * i / 4;
    g.beginPath(); g.moveTo(X(xv), pad.t); g.lineTo(X(xv), H - pad.b); g.stroke();
    g.beginPath(); g.moveTo(pad.l, Y(yv)); g.lineTo(W - pad.r, Y(yv)); g.stroke();
    const z = v => (Math.abs(v) < 5e-3 ? 0 : v).toFixed(2);   // 别让刻度写成 -0.00
    g.fillText(z(xv), X(xv) - 12, H - 9);
    g.fillText(z(yv), 6, Y(yv) + 3);
  }
  if (ylo < 0 && yhi > 0){                              // y=0 参考线
    g.strokeStyle = '#3a4657'; g.beginPath(); g.moveTo(pad.l, Y(0)); g.lineTo(W - pad.r, Y(0)); g.stroke();
  }
  const stroke = (xs, ys, color, wide) => {
    g.strokeStyle = color; g.lineWidth = wide ? 2.4 : 1.4; g.beginPath();
    xs.forEach((x, i) => i ? g.lineTo(X(x), Y(ys[i])) : g.moveTo(X(x), Y(ys[i])));
    g.stroke();
  };
  if (f.truth) stroke(f.cx, f.truth, COL.truth, false);
  if (f.pred)  stroke(f.cx, f.pred, COL.pred, true);
  g.fillStyle = COL.data;                               // 数据点最后画，压在线上看得见
  f.x.forEach((x, i) => { g.beginPath(); g.arc(X(x), Y(f.y[i]), 3.2, 0, 7); g.fill(); });
  return c;
}

function fitBlock(f){
  const box = document.createElement('div'); box.className = 'fit';
  const h = document.createElement('h3'); h.textContent = f.name;
  const note = document.createElement('p'); note.className = 'note'; note.textContent = f.note || '';
  box.append(h, note);
  box.appendChild(drawFit(box, f));
  const lg = document.createElement('div'); lg.className = 'legend';
  lg.innerHTML = `<span><i class="dot" style="background:${COL.data}"></i>数据点 ${f.x.length}</span>`
    + (f.truth ? `<span><i style="background:${COL.truth}"></i>真实函数</span>` : '')
    + `<span><i style="background:${COL.pred}"></i>你的模型</span>`
    + `<span>曲线取样 ${f.cx.length} 个点</span>`;
  box.appendChild(lg);
  return box;
}

function lossBlock(cv){
  const box = document.createElement('div'); box.className = 'fit';
  const h = document.createElement('h3'); h.textContent = cv.name;
  box.appendChild(h);
  if (cv.note){ const n = document.createElement('p'); n.className = 'note'; n.textContent = cv.note; box.appendChild(n); }
  const vals = cv.values.filter(v => v > 0);
  const c = document.createElement('canvas');
  const dpr = Math.min(2, devicePixelRatio || 1), W = Math.max(420, box.clientWidth || 900), H = 190;
  c.width = W * dpr; c.height = H * dpr; c.style.width = '100%'; c.style.height = H + 'px';
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const pad = {l:56, r:12, t:10, b:20};
  const lo = Math.log10(Math.min(...vals)), hi = Math.log10(Math.max(...vals));
  const X = i => pad.l + i / (vals.length - 1) * (W - pad.l - pad.r);
  const Y = v => H - pad.b - (Math.log10(v) - lo) / ((hi - lo) || 1) * (H - pad.t - pad.b);
  g.fillStyle = '#0b0e13'; g.fillRect(0, 0, W, H);
  g.strokeStyle = COL.axis; g.font = '10px ui-monospace,Consolas'; g.fillStyle = COL.text;
  for (let i = 0; i <= 4; i++){
    const e = lo + (hi - lo) * i / 4;
    const v = 10 ** e;
    g.beginPath(); g.moveTo(pad.l, Y(v)); g.lineTo(W - pad.r, Y(v)); g.stroke();
    /* 别写 1e-14.7 —— 没人能心算"10 的负 14.7 次方"。直接给科学计数法真值。 */
    g.fillText(v.toExponential(1), 6, Y(v) + 3);
  }
  g.strokeStyle = COL.pred; g.lineWidth = 1.8; g.beginPath();
  vals.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.stroke();
  g.fillStyle = COL.text; g.fillText('第 1 轮', pad.l, H - 6);
  g.fillText('第 ' + vals.length + ' 轮', W - pad.r - 46, H - 6);
  box.appendChild(c);
  return box;
}

function render(d){
  $('who').textContent = '· ' + (d.title || d.stage || '');
  if (d.error){ $('stamp').textContent = '读取出错：' + d.error; return; }
  if (!d.when){ $('stamp').textContent = '这个阶段还没有测评记录 —— 回主窗口点「提交并测评」。'; return; }
  $('stamp').textContent = `${d.when} 跑完` + (d.secs ? ` · ${d.secs}s` : '') +
    (d.kind === 'check' ? ` · 单项 ${d.id || ''}` : ' · 整卷');

  const v = $('verdict');
  const label = {pass:'通过', fail:'未通过', pending:'还没写完', error:'脚本报错'}[d.status] || d.status || '—';
  v.className = 'verdict ' + (d.status || '') + (d.answer ? ' answer' : '');
  v.innerHTML = `<span class="big">${d.answer ? '答案跑通' : label}</span>`
    + (d.total ? `<span class="meta">${d.got}/${d.total} 条硬判据达标</span>` : '')
    + (d.answer ? '<span class="meta">跑的是 solutions/ 那份答案，不是你的代码</span>' : '')
    + `<span class="sub">${escapeHtml(d.line || '')}</span>`;

  const fits = d.fits || [];
  $('sec-fits').hidden = !fits.length;
  const fb = $('fits'); fb.innerHTML = '';
  fits.forEach(f => fb.appendChild(fitBlock(f)));

  const rows = d.criteria || [];
  $('sec-cards').hidden = !rows.length;
  const cb = $('cards'); cb.innerHTML = '';
  const grouped = rows.some(r => r.group);   // 没分组就别硬塞一个「未分组」标题
  let last = null;
  for (const r of rows){
    const g = r.group || '';
    if (grouped && g !== last){ const h = document.createElement('div'); h.className = 'grp';
      h.textContent = g || '未分组'; cb.appendChild(h); last = g; }
    const div = document.createElement('div'); div.className = 'crit';
    const mk = r.mark === 'PASS' ? 'ok' : r.kind === 'info' ? 'info'
             : r.kind === 'soft' ? 'warn' : 'no';      // 软性提示别涂成红色，它不判失败
    div.innerHTML = `<span class="mk ${mk}">${escapeHtml(r.mark)}</span>`
      + `<span class="nm">${escapeHtml(r.name)}</span>`
      + `<span class="dt">${escapeHtml(r.detail || '')}</span>`;
    cb.appendChild(div);
  }

  const curves = d.curves || [];
  $('sec-curves').hidden = !curves.length;
  const kb = $('curves'); kb.innerHTML = '';
  curves.forEach(c => { if ((c.values || []).length > 1) kb.appendChild(lossBlock(c)); });

  const out = ((d.output || '') + (d.truncated ? '\n…（输出过长，已截断）' : '')).replace(/\r\n?/g, '\n');
  $('sec-raw').hidden = !out;
  // 认得出四段就排卡片，认不出（整卷的控制台输出、BLOCKED 的一行）就退回等宽文本上色。
  const card = d.kind === 'check' && /^ {2}目的 {2}/m.test(out) ? checkCard(out) : '';
  $('card').hidden = !card; $('card').innerHTML = card;
  $('raw').hidden = !!card;
  if (!card) $('raw').innerHTML = rawHtml(out);
}

function escapeHtml(s){ return String(s).replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch])); }

/* ---------- 单项快测的四段 → 卡片 ---------- */

/* 一次扫描分五种东西：形状、dtype、TODO 编号、括注、公式，剩下的是数字。
   顺序是有讲究的：先吃掉 shape(...)，公式那条就不会把 "shape(2,4,5)" 里的 = 扯进来。
   公式的右半边遇到中文就停 —— 不然 "dx = g@W（返回值，形状要和 x 一样）" 会一路斜体到句号。 */
const TOK = /(shape\([^)]*\))|(float64|float32|int64|bool)(?![\w])|(TODO-[0-9]+(?:\/[0-9]+)?[A-Za-z]?)|(（[^）]*）)|([A-Za-z_][A-Za-z_0-9_²ᵀ*·]*\s*=\s*[^，,；;。（）:：、\u3000-\u303f\u4e00-\u9fff\s][^，,；;。（）:：、\u3000-\u303f\u4e00-\u9fff]*)|(\d+\.\d+(?:[eE][+-]?\d+)?|\d[eE][+-]?\d+)/g;
const NUM = /\d+\.\d+(?:[eE][+-]?\d+)?/g;

function dims(t){
  const inner = t.slice(6, -1).trim();
  return inner ? inner.split(/,\s*/).filter(s => s).join(' × ') : '标量';
}

function inline(s){
  let out = '', last = 0, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(s))) {
    out += escapeHtml(s.slice(last, m.index));
    if (m[1]) out += `<span class="chip shape">${dims(m[1])}</span>`;
    else if (m[2]) out += `<span class="chip dtype">${m[2]}</span>`;
    else if (m[3]) out += `<span class="todo">${m[3]}</span>`;
    else if (m[4]) out += `<span class="paren">${escapeHtml(m[4])}</span>`;
    else if (m[5]) out += `<span class="m">${escapeHtml(m[5].trimEnd()).replace(NUM, x => `<span class="num">${x}</span>`)}</span>`;
    else out += `<span class="num">${m[6]}</span>`;
    last = m.index + m[0].length;
  }
  return out + escapeHtml(s.slice(last));
}

function ioRow(row){
  const bar = row.indexOf('　');                       // 全角空格：card() 用它分隔值和括注
  const body = bar < 0 ? row : row.slice(0, bar);
  const note = bar < 0 ? '' : row.slice(bar + 1);
  const eq = body.indexOf(' = ');
  const k = eq < 0 ? '' : body.slice(0, eq);
  const v = eq < 0 ? body : body.slice(eq + 3);
  return `<div class="k">${inline(k)}</div><div class="v">${inline(v)}` +
         (note ? `<span class="cmt">${inline(note)}</span>` : '') + '</div>';
}

function checkCard(text){
  const seg = {why: [], ins: [], outs: []}, verdicts = [], rest = [];
  let cur = null;
  // 判据是 Windows 上的子进程，行尾是 \r\n：不先归一，`(.*)$` 会被那个 \r 顶得整行匹配不上
  for (const ln of text.replace(/\r\n?/g, '\n').split('\n')) {
    let m = /^ {2}(目的|输入|输出) {2}(.*)$/.exec(ln);
    if (m) { cur = m[1] === '目的' ? 'why' : m[1] === '输入' ? 'ins' : 'outs'; seg[cur].push(m[2]); continue; }
    if (cur && cur !== 'why' && /^ {8}\S/.test(ln)) { seg[cur].push(ln.slice(8)); continue; }
    m = /^(PASS|FAIL|BLOCKED)\b.*$/.exec(ln);
    if (m) { verdicts.push(m[0]); cur = null; continue; }
    if (ln.trim()) rest.push(ln);
  }
  let html = '';
  if (seg.why.length)
    html += `<div class="seg"><span class="tag">目的</span><p class="why">${seg.why.map(inline).join(' ')}</p></div>`;
  for (const [key, name] of [['ins', '输入'], ['outs', '输出']])
    if (seg[key].length)
      html += `<div class="seg"><span class="tag">${name}</span><div class="io">` +
              seg[key].map(ioRow).join('') + '</div></div>';
  verdicts.forEach(line => {
    const m = /^(PASS|FAIL|BLOCKED)\s+(.*)$/.exec(line);
    const cls = m[1] === 'PASS' ? 'ok' : m[1] === 'FAIL' ? 'no' : 'warn';
    html += `<div class="seg"><span class="tag">判定</span><div class="verdict">` +
            `<span class="mk ${cls}">${m[1]}</span><span class="dt">${inline(m[2] || '')}</span></div></div>`;
  });
  if (rest.length) html += `<div class="rest">${escapeHtml(rest.join('\n'))}</div>`;
  return html;
}

/* 原始输出按四段上色：目的 / 输入 / 输出 的段标签压暗，结论行显示成「判定」并着色。
   结论行在文本里是 PASS/FAIL 打头（服务端和命令行都按行首找它），这里只是把它**显示**成第四段，
   一个字都没改 —— 这份仍然是判据自己打印的那一份。 */
function rawHtml(t){
  return t.replace(/\r\n?/g, '\n').split('\n').map(ln => {
    const seg = /^((?:  )?(?:目的|输入|输出)  )([\s\S]*)$/.exec(ln);
    if (seg) return `<span class="lbl">${escapeHtml(seg[1])}</span>${escapeHtml(seg[2])}`;
    const v = /^(PASS|FAIL|BLOCKED)\b[\s\S]*/.exec(ln);
    if (v) {
      const cls = v[0].startsWith('PASS') ? 'ok' : v[0].startsWith('FAIL') ? 'bad' : 'warn';
      return `<span class="lbl">  判定  </span><span class="${cls}">${escapeHtml(v[0])}</span>`;
    }
    return escapeHtml(ln);
  }).join('\n');
}

async function poll(){
  try { render(await fetch('/api/result?stage=' + encodeURIComponent(STAGE)).then(x => x.json())); }
  catch(e){ $('stamp').textContent = '连不上测评台（' + e + '）—— 服务还开着吗？'; }
}
let timer = null;
function schedule(){ clearInterval(timer); if ($('auto').checked) timer = setInterval(poll, 1500); }
$('auto').onchange = schedule;
$('now').onclick = poll;
$('back').onclick = () => location.href = '/?stage=' + encodeURIComponent(STAGE);
addEventListener('resize', () => poll());
poll(); schedule();
</script>
</body>
</html>
